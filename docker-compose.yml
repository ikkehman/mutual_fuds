version: '3.8'

services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      REDIS_ADDR: redis:6379
      PREDICTION_SERVICE_URL: http://prediction-service:5001
    depends_on:
      - db
      - redis
      - prediction-service
    networks:
      - mynet

  prediction-service:
    build: ./prediction_service
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - mynet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynet

  redis:
    image: redis:7-alpine
    networks:
      - mynet

volumes:
  postgres_data:

networks:
  mynet: